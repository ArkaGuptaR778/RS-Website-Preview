<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="banks-title banks-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="banks-title">Banks: one interoperable layer</title>
  <desc id="banks-desc">Many biller connections converge into a single interoperable layer that links to the bank, which confirms a bill payment on the customer's phone.</desc>
  <style>
    .flow { stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 214px 160px; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  </style>

  <!-- Biller tiles -->
  <g fill="#FFFFFF" stroke="#A9CDE5" stroke-width="1.5">
    <rect x="34" y="46" width="54" height="42" rx="9"/>
    <rect x="34" y="106" width="54" height="42" rx="9"/>
    <rect x="34" y="172" width="54" height="42" rx="9"/>
    <rect x="34" y="232" width="54" height="42" rx="9"/>
  </g>
  <!-- Tile icons: electricity, water, telecom, loan/card -->
  <path d="M63 54 L54 69 H61 L57 81 L68 64 H61 Z" fill="#5BA4D6"/>
  <path d="M61 114 C61 114 52 125 52 131 A9 9 0 0 0 70 131 C70 125 61 114 61 114 Z" fill="#5BA4D6"/>
  <g fill="#5BA4D6">
    <rect x="50" y="197" width="5" height="9" rx="1.5"/>
    <rect x="58" y="191" width="5" height="15" rx="1.5"/>
    <rect x="66" y="184" width="5" height="22" rx="1.5"/>
  </g>
  <rect x="47" y="244" width="28" height="19" rx="3.5" fill="none" stroke="#5BA4D6" stroke-width="2"/>
  <rect x="47" y="249" width="28" height="4" fill="#5BA4D6"/>

  <!-- Connections converging into the layer -->
  <g fill="none" stroke="#A9CDE5" stroke-width="2" stroke-linecap="round">
    <path d="M88 67 C145 67 150 130 200 140"/>
    <path d="M88 127 C140 127 160 152 200 154"/>
    <path d="M88 193 C140 193 160 168 200 166"/>
    <path d="M88 253 C145 253 150 190 200 180"/>
  </g>
  <g fill="none" stroke="#0A6EB4" stroke-width="2" stroke-linecap="round" class="flow">
    <path d="M88 67 C145 67 150 130 200 140"/>
    <path d="M88 127 C140 127 160 152 200 154"/>
    <path d="M88 193 C140 193 160 168 200 166"/>
    <path d="M88 253 C145 253 150 190 200 180"/>
  </g>

  <!-- Interoperable layer -->
  <rect x="190" y="84" width="48" height="152" rx="24" fill="#D6E8F5" class="pulse"/>
  <rect x="200" y="96" width="28" height="128" rx="14" fill="#0A6EB4"/>
  <g fill="#FFFFFF">
    <circle cx="214" cy="140" r="3"/>
    <circle cx="214" cy="154" r="3"/>
    <circle cx="214" cy="166" r="3"/>
    <circle cx="214" cy="180" r="3"/>
  </g>

  <!-- Single connection to the bank -->
  <path d="M228 160 H288" fill="none" stroke="#A9CDE5" stroke-width="3" stroke-linecap="round"/>
  <path d="M228 160 H288" fill="none" stroke="#0A6EB4" stroke-width="3" stroke-linecap="round" class="flow"/>

  <!-- Bank -->
  <polygon points="280,116 384,116 332,86" fill="#5BA4D6"/>
  <rect x="288" y="116" width="88" height="88" fill="#FFFFFF" stroke="#A9CDE5" stroke-width="1.5"/>
  <g fill="#D6E8F5">
    <rect x="298" y="128" width="10" height="66" rx="2"/>
    <rect x="318" y="128" width="10" height="66" rx="2"/>
    <rect x="338" y="128" width="10" height="66" rx="2"/>
    <rect x="358" y="128" width="10" height="66" rx="2"/>
  </g>
  <rect x="280" y="204" width="104" height="10" rx="3" fill="#A9CDE5"/>

  <!-- Customer phone with confirmed payment -->
  <rect x="368" y="168" width="78" height="120" rx="12" fill="#FFFFFF" stroke="#A9CDE5" stroke-width="1.5"/>
  <rect x="396" y="176" width="22" height="4" rx="2" fill="#D6E8F5"/>
  <rect x="378" y="192" width="58" height="36" rx="6" fill="#EEF5FB"/>
  <rect x="385" y="200" width="30" height="5" rx="2.5" fill="#A9CDE5"/>
  <rect x="385" y="211" width="42" height="5" rx="2.5" fill="#D6E8F5"/>
  <rect x="378" y="236" width="58" height="6" rx="3" fill="#D6E8F5"/>
  <circle cx="407" cy="264" r="13" fill="#FFFFFF" stroke="#0A6EB4" stroke-width="2"/>
  <path d="M401 264 L405.5 268.5 L413 260" fill="none" stroke="#0A6EB4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
