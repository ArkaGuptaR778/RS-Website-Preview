<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="customers-title customers-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="customers-title">Customers: every bill in one place</title>
  <desc id="customers-desc">A phone shows all of a customer's bills in one inbox, with a due-date reminder, an auto-pay schedule and a payment confirmed by the biller.</desc>
  <style>
    .ring { animation: ring 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 10%; }
    .live { animation: live 1.8s ease-in-out infinite; }
    @keyframes ring { 0%,70%,100% { transform: rotate(0); } 76% { transform: rotate(14deg); } 84% { transform: rotate(-12deg); } 92% { transform: rotate(6deg); } }
    @keyframes live { 0%,100% { opacity: .3; } 50% { opacity: .85; } }
    @media (prefers-reduced-motion: reduce) { .ring, .live { animation: none; } }
  </style>

  <!-- Phone with bill inbox -->
  <rect x="178" y="34" width="124" height="252" rx="18" fill="#FFFFFF" stroke="#C7BDEA" stroke-width="1.5"/>
  <rect x="222" y="44" width="36" height="5" rx="2.5" fill="#E6E1F6"/>
  <rect x="192" y="62" width="60" height="10" rx="5" fill="#C7BDEA"/>
  <!-- Bill rows -->
  <g fill="#F4F1FC" stroke="#E6E1F6" stroke-width="1">
    <rect x="190" y="86" width="100" height="40" rx="8"/>
    <rect x="190" y="134" width="100" height="40" rx="8"/>
    <rect x="190" y="182" width="100" height="40" rx="8"/>
  </g>
  <g fill="#7C64C9">
    <circle cx="206" cy="106" r="9"/>
    <circle cx="206" cy="154" r="9"/>
    <circle cx="206" cy="202" r="9"/>
  </g>
  <!-- Category glyphs: electricity, water, mobile -->
  <path d="M207.5 99.5 L202.5 107 H206 L204.5 112.5 L209.5 105 H206 Z" fill="#FFFFFF"/>
  <path d="M206 147.5 C206 147.5 201.5 153 201.5 156 A4.5 4.5 0 0 0 210.5 156 C210.5 153 206 147.5 206 147.5 Z" fill="#FFFFFF"/>
  <rect x="202.5" y="196" width="7" height="12" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
  <g fill="#C7BDEA">
    <rect x="221" y="99" width="36" height="6" rx="3"/>
    <rect x="221" y="147" width="30" height="6" rx="3"/>
    <rect x="221" y="195" width="34" height="6" rx="3"/>
  </g>
  <g fill="#E6E1F6">
    <rect x="221" y="109" width="24" height="5" rx="2.5"/>
    <rect x="221" y="157" width="20" height="5" rx="2.5"/>
    <rect x="221" y="205" width="26" height="5" rx="2.5"/>
  </g>
  <!-- Row status: paid, due soon, auto-pay -->
  <circle cx="276" cy="106" r="7" fill="#4B2E9E"/>
  <path d="M272.8 106.1 L275 108.3 L279.3 103.8" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="276" cy="154" r="7" fill="none" stroke="#7C64C9" stroke-width="1.6" class="live"/>
  <circle cx="276" cy="154" r="2.5" fill="#7C64C9"/>
  <rect x="268" y="199" width="16" height="7" rx="3.5" fill="#E6E1F6"/>
  <!-- Pay button -->
  <rect x="190" y="238" width="100" height="28" rx="14" fill="#4B2E9E"/>
  <rect x="220" y="249" width="40" height="6" rx="3" fill="#C7BDEA"/>

  <!-- Reminder notification -->
  <rect x="40" y="70" width="124" height="54" rx="12" fill="#FFFFFF" stroke="#C7BDEA" stroke-width="1.5"/>
  <circle cx="64" cy="97" r="13" fill="#E6E1F6"/>
  <g class="ring">
    <path d="M58.5 101 V95.5 A5.5 5.5 0 0 1 69.5 95.5 V101 L71 103 H57 Z" fill="#7C64C9"/>
    <circle cx="64" cy="105" r="1.8" fill="#7C64C9"/>
  </g>
  <rect x="84" y="88" width="62" height="7" rx="3.5" fill="#C7BDEA"/>
  <rect x="84" y="100" width="44" height="6" rx="3" fill="#E6E1F6"/>
  <path d="M164 97 C172 97 172 150 178 152" fill="none" stroke="#C7BDEA" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- Auto-pay schedule -->
  <rect x="52" y="178" width="100" height="84" rx="12" fill="#FFFFFF" stroke="#C7BDEA" stroke-width="1.5"/>
  <rect x="52" y="178" width="100" height="20" rx="12" fill="#E6E1F6"/>
  <rect x="52" y="190" width="100" height="8" fill="#E6E1F6"/>
  <g fill="#E6E1F6">
    <rect x="64" y="208" width="12" height="10" rx="2"/><rect x="82" y="208" width="12" height="10" rx="2"/>
    <rect x="100" y="208" width="12" height="10" rx="2"/><rect x="118" y="208" width="12" height="10" rx="2"/>
    <rect x="64" y="224" width="12" height="10" rx="2"/><rect x="82" y="224" width="12" height="10" rx="2"/>
    <rect x="118" y="224" width="12" height="10" rx="2"/>
    <rect x="64" y="240" width="12" height="10" rx="2"/><rect x="82" y="240" width="12" height="10" rx="2"/>
    <rect x="100" y="240" width="12" height="10" rx="2"/>
  </g>
  <rect x="100" y="224" width="12" height="10" rx="2" fill="#4B2E9E"/>
  <circle cx="134" cy="248" r="10" fill="#7C64C9"/>
  <path d="M129.5 247 A4.8 4.8 0 0 1 138 245.5 M138.5 249 A4.8 4.8 0 0 1 130 250.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M137.5 242.8 L138.3 245.8 L135.3 246" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M152 220 C164 220 166 205 178 203" fill="none" stroke="#C7BDEA" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- Biller-confirmed receipt -->
  <path d="M302 106 C316 106 318 150 330 152" fill="none" stroke="#C7BDEA" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="330" y="118" width="116" height="112" rx="12" fill="#FFFFFF" stroke="#C7BDEA" stroke-width="1.5"/>
  <circle cx="388" cy="152" r="18" fill="#E6E1F6"/>
  <circle cx="388" cy="152" r="12" fill="#4B2E9E"/>
  <path d="M382.5 152.3 L386.3 156 L393.8 148.4" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="352" y="182" width="72" height="7" rx="3.5" fill="#C7BDEA"/>
  <rect x="362" y="195" width="52" height="6" rx="3" fill="#E6E1F6"/>
  <rect x="344" y="210" width="88" height="1" fill="#E6E1F6"/>
  <rect x="372" y="216" width="32" height="5" rx="2.5" fill="#E6E1F6"/>
</svg>
