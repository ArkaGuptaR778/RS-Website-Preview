<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="networks-title networks-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="networks-title">Networks: one switch connecting every participant</title>
  <desc id="networks-desc">A central switch links biller banks on one side and customer banks and apps on the other, with governance and end-to-end tracking built in.</desc>
  <style>
    .flow { stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
    .halo { animation: halo 2.6s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes halo { 0%,100% { opacity: .35; } 50% { opacity: .75; } }
    @media (prefers-reduced-motion: reduce) { .flow, .halo { animation: none; } }
  </style>

  <!-- Spokes -->
  <g fill="none" stroke="#F2C99A" stroke-width="2" stroke-linecap="round">
    <path d="M108 78 C170 78 180 140 198 150"/>
    <path d="M108 160 H196"/>
    <path d="M108 242 C170 242 180 180 198 170"/>
    <path d="M372 78 C310 78 300 140 282 150"/>
    <path d="M372 160 H284"/>
    <path d="M372 242 C310 242 300 180 282 170"/>
  </g>
  <g fill="none" stroke="#A14E00" stroke-width="2" stroke-linecap="round" class="flow">
    <path d="M108 78 C170 78 180 140 198 150"/>
    <path d="M108 160 H196"/>
    <path d="M108 242 C170 242 180 180 198 170"/>
    <path d="M282 150 C300 140 310 78 372 78"/>
    <path d="M284 160 H372"/>
    <path d="M282 170 C300 180 310 242 372 242"/>
  </g>

  <!-- Biller-side banks -->
  <g>
    <rect x="44" y="54" width="64" height="48" rx="10" fill="#FFFFFF" stroke="#F2C99A" stroke-width="1.5"/>
    <rect x="44" y="136" width="64" height="48" rx="10" fill="#FFFFFF" stroke="#F2C99A" stroke-width="1.5"/>
    <rect x="44" y="218" width="64" height="48" rx="10" fill="#FFFFFF" stroke="#F2C99A" stroke-width="1.5"/>
  </g>
  <g fill="#E08A2E">
    <polygon points="62,72 90,72 76,63"/><rect x="64" y="73" width="24" height="14" fill="none" stroke="#E08A2E" stroke-width="2"/><rect x="61" y="88" width="30" height="4" rx="1"/>
    <polygon points="62,154 90,154 76,145"/><rect x="64" y="155" width="24" height="14" fill="none" stroke="#E08A2E" stroke-width="2"/><rect x="61" y="170" width="30" height="4" rx="1"/>
    <polygon points="62,236 90,236 76,227"/><rect x="64" y="237" width="24" height="14" fill="none" stroke="#E08A2E" stroke-width="2"/><rect x="61" y="252" width="30" height="4" rx="1"/>
  </g>

  <g fill="#E08A2E"><rect x="69" y="75" width="3" height="10" rx="1"/><rect x="74.5" y="75" width="3" height="10" rx="1"/><rect x="80" y="75" width="3" height="10" rx="1"/><rect x="69" y="157" width="3" height="10" rx="1"/><rect x="74.5" y="157" width="3" height="10" rx="1"/><rect x="80" y="157" width="3" height="10" rx="1"/><rect x="69" y="239" width="3" height="10" rx="1"/><rect x="74.5" y="239" width="3" height="10" rx="1"/><rect x="80" y="239" width="3" height="10" rx="1"/></g>

  <!-- Customer-side banks and apps -->
  <g fill="#FFFFFF" stroke="#F2C99A" stroke-width="1.5">
    <rect x="372" y="54" width="64" height="48" rx="10"/>
    <rect x="372" y="136" width="64" height="48" rx="10"/>
    <rect x="372" y="218" width="64" height="48" rx="10"/>
  </g>
  <g fill="none" stroke="#E08A2E" stroke-width="2">
    <rect x="396" y="63" width="16" height="30" rx="3.5"/>
    <rect x="396" y="145" width="16" height="30" rx="3.5"/>
    <rect x="396" y="227" width="16" height="30" rx="3.5"/>
  </g>
  <g fill="#E08A2E">
    <circle cx="404" cy="88" r="1.8"/><circle cx="404" cy="170" r="1.8"/><circle cx="404" cy="252" r="1.8"/>
  </g>

  <!-- Central switch -->
  <circle cx="240" cy="160" r="58" fill="#FBE7D0" class="halo"/>
  <circle cx="240" cy="160" r="44" fill="#A14E00"/>
  <circle cx="240" cy="160" r="44" fill="none" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="1"/>
  <!-- Switch glyph: routes crossing through a hub -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round">
    <path d="M220 148 H260 M253 141 L260 148 L253 155"/>
    <path d="M260 172 H220 M227 165 L220 172 L227 179"/>
  </g>

  <!-- Governance badge -->
  <circle cx="276" cy="120" r="14" fill="#FFFFFF" stroke="#F2C99A" stroke-width="1.5"/>
  <path d="M276 111.5 L283 114.5 V119.5 C283 124 280 127 276 128.5 C272 127 269 124 269 119.5 V114.5 Z" fill="#E08A2E"/>
  <path d="M273 119.8 L275.3 122 L279.2 117.8" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- End-to-end tracking strip -->
  <g>
    <rect x="166" y="276" width="148" height="24" rx="12" fill="#FFFFFF" stroke="#F2C99A" stroke-width="1.5"/>
    <path d="M186 288 H294" stroke="#FBE7D0" stroke-width="3" stroke-linecap="round"/>
    <path d="M186 288 H258" stroke="#E08A2E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="186" cy="288" r="5" fill="#A14E00"/>
    <circle cx="222" cy="288" r="5" fill="#A14E00"/>
    <circle cx="258" cy="288" r="5" fill="#A14E00"/>
    <circle cx="294" cy="288" r="5" fill="#FFFFFF" stroke="#E08A2E" stroke-width="1.5" class="halo"/>
  </g>
  <path d="M240 218 V276" stroke="#F2C99A" stroke-width="1.5" stroke-dasharray="3 4"/>
</svg>
