<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="billers-title billers-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="billers-title">Billers: faster collections, automatic reconciliation, live visibility</title>
  <desc id="billers-desc">Incoming payments flow into the biller's ledger, where each entry is matched automatically, and a live dashboard shows collections rising.</desc>
  <style>
    .flow { stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
    .live { animation: live 1.8s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes live { 0%,100% { opacity: .25; } 50% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { .flow, .live { animation: none; } }
  </style>

  <!-- Incoming payments -->
  <g fill="#FFFFFF" stroke="#A8D1C0" stroke-width="1.5">
    <rect x="26" y="88" width="84" height="32" rx="16"/>
    <rect x="26" y="144" width="84" height="32" rx="16"/>
    <rect x="26" y="200" width="84" height="32" rx="16"/>
  </g>
  <g fill="#3E9A78">
    <circle cx="44" cy="104" r="9"/>
    <circle cx="44" cy="160" r="9"/>
    <circle cx="44" cy="216" r="9"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 104 H48 M45 100.5 L48.5 104 L45 107.5"/>
    <path d="M40 160 H48 M45 156.5 L48.5 160 L45 163.5"/>
    <path d="M40 216 H48 M45 212.5 L48.5 216 L45 219.5"/>
  </g>
  <g fill="#C9E4D8">
    <rect x="60" y="100" width="38" height="8" rx="4"/>
    <rect x="60" y="156" width="30" height="8" rx="4"/>
    <rect x="60" y="212" width="34" height="8" rx="4"/>
  </g>

  <!-- Payments flowing into the ledger -->
  <g fill="none" stroke="#C9E4D8" stroke-width="2" stroke-linecap="round">
    <path d="M110 104 C140 104 145 118 170 118"/>
    <path d="M110 160 H170"/>
    <path d="M110 216 C140 216 145 202 170 202"/>
  </g>
  <g fill="none" stroke="#0B5E46" stroke-width="2" stroke-linecap="round" class="flow">
    <path d="M110 104 C140 104 145 118 170 118"/>
    <path d="M110 160 H170"/>
    <path d="M110 216 C140 216 145 202 170 202"/>
  </g>

  <!-- Ledger with auto-matched entries -->
  <rect x="170" y="52" width="132" height="216" rx="12" fill="#FFFFFF" stroke="#A8D1C0" stroke-width="1.5"/>
  <rect x="184" y="66" width="104" height="12" rx="4" fill="#A8D1C0"/>
  <g fill="#C9E4D8">
    <rect x="184" y="113" width="48" height="7" rx="3.5"/>
    <rect x="184" y="141" width="40" height="7" rx="3.5"/>
    <rect x="184" y="169" width="46" height="7" rx="3.5"/>
    <rect x="184" y="197" width="38" height="7" rx="3.5"/>
    <rect x="184" y="225" width="44" height="7" rx="3.5"/>
  </g>
  <g fill="#8FC1AE">
    <rect x="240" y="113" width="20" height="7" rx="3.5"/>
    <rect x="240" y="141" width="20" height="7" rx="3.5"/>
    <rect x="240" y="169" width="20" height="7" rx="3.5"/>
    <rect x="240" y="197" width="20" height="7" rx="3.5"/>
    <rect x="240" y="225" width="20" height="7" rx="3.5"/>
  </g>
  <!-- Matched ticks -->
  <g fill="#0B5E46">
    <circle cx="280" cy="116.5" r="7"/>
    <circle cx="280" cy="144.5" r="7"/>
    <circle cx="280" cy="172.5" r="7"/>
    <circle cx="280" cy="200.5" r="7"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M276.8 116.6 L279 118.8 L283.3 114.3"/>
    <path d="M276.8 144.6 L279 146.8 L283.3 142.3"/>
    <path d="M276.8 172.6 L279 174.8 L283.3 170.3"/>
    <path d="M276.8 200.6 L279 202.8 L283.3 198.3"/>
  </g>
  <!-- Entry being matched right now -->
  <circle cx="280" cy="228.5" r="7" fill="none" stroke="#0B5E46" stroke-width="1.5" stroke-dasharray="3 3" class="live"/>
  <rect x="184" y="88" width="104" height="1" fill="#E3F3EC"/>

  <!-- Ledger feeding the live dashboard -->
  <path d="M302 160 H330" fill="none" stroke="#C9E4D8" stroke-width="3" stroke-linecap="round"/>
  <path d="M302 160 H330" fill="none" stroke="#0B5E46" stroke-width="3" stroke-linecap="round" class="flow"/>

  <!-- Live collections dashboard -->
  <rect x="330" y="92" width="124" height="136" rx="12" fill="#FFFFFF" stroke="#A8D1C0" stroke-width="1.5"/>
  <rect x="344" y="106" width="44" height="8" rx="4" fill="#C9E4D8"/>
  <circle cx="436" cy="110" r="7" fill="#3E9A78" class="live"/>
  <circle cx="436" cy="110" r="3.5" fill="#0B5E46"/>
  <g fill="#C9E4D8">
    <rect x="346" y="188" width="14" height="24" rx="3"/>
    <rect x="366" y="176" width="14" height="36" rx="3"/>
    <rect x="386" y="164" width="14" height="48" rx="3"/>
  </g>
  <g fill="#3E9A78">
    <rect x="406" y="150" width="14" height="62" rx="3"/>
  </g>
  <rect x="426" y="136" width="14" height="76" rx="3" fill="#0B5E46"/>
  <path d="M348 168 L373 156 L393 146 L413 132 L426 125" fill="none" stroke="#0B5E46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
