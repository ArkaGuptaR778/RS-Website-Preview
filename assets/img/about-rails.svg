<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" width="1100" height="880" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>RS Software at the centre of connected payment rails</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2545"/><stop offset=".5" stop-color="#0a4f86"/><stop offset=".78" stop-color="#0075b7"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5cc5bf" stop-opacity=".55"/><stop offset="1" stop-color="#5cc5bf" stop-opacity="0"/></radialGradient>
<linearGradient id="railg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#99f6e4"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#fff" fill-opacity=".09"/></pattern>
<style>
.rail{fill:none;stroke:url(#railg);stroke-width:2.2;stroke-dasharray:10 8;stroke-opacity:.8;animation:flow 5s linear infinite}
.ring{fill:none;stroke:#fff;stroke-opacity:.14;stroke-dasharray:3 9}
.wave{fill:none;stroke:#fff;stroke-opacity:.10;stroke-width:1.2;stroke-dasharray:6 6;animation:flow 9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-72}}
@media (prefers-reduced-motion:reduce){.rail,.wave{animation:none}}
</style>
</defs>
<rect width="1100" height="880" fill="url(#bg)"/>
